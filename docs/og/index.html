<style>
@import url("https://fonts.googleapis.com/css2?family=Geist:wght@400;700&family=Geist+Mono:wght@400&display=swap");

* {
	margin: 0;
	box-sizing: border-box;
}

body {
	container-type: inline-size;
	position: relative;
	display: flex;
	align-items: center;
	width: 1200px;
	height: 630px;
	padding: 0 7%;
	overflow: hidden;
	font-family: Geist, sans-serif;
	background: #101517;
}

body::before {
	content: "";
	position: absolute;
	inset: 0;
	background:
		radial-gradient(60% 100% at 85% 25%, rgb(0 173 208 / 0.35), transparent 60%),
		radial-gradient(55% 90% at 10% 90%, rgb(66 122 231 / 0.28), transparent 62%);
}

.card {
	position: relative;
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 5%;
	width: 100%;
}

.lines {
	display: flex;
	flex-direction: column;
	gap: 2.2%;
}

.package {
	display: flex;
	align-items: center;
	gap: 2.2%;
	font-family: Geist Mono, monospace;
	font-size: 2.7cqw;
	color: #c3cbce;
}

.title {
	font-size: 6.4cqw;
	font-weight: 700;
	line-height: 1.05;
	letter-spacing: -0.03em;
	color: #fff;
}

.title em {
	background: linear-gradient(100deg, #2ad5e5, #75a9ff);
	background-clip: text;
	font-style: normal;
	color: transparent;
}

.tagline {
	font-size: 2.7cqw;
	line-height: 1.35;
	color: #a4b0b4;
}

.mark {
	display: block;
	height: auto;
}

.package .mark {
	width: 5cqw;
}

.card > .mark {
	flex: none;
	width: 24cqw;
}
</style>
</head>
